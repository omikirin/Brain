<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="js/gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoNinja 図鑑 — 同人お助けサイト</title>
<style>
  :root{
    --bg:#12121a; --panel:#1c1c28; --panel2:#242436; --line:#33334a;
    --text:#e8e8f0; --sub:#9a9ab0; --accent:#e0483e;
    --iga:#4a7bd0; --koka:#4caf78; --fuma:#b04ad0; --saika:#d0a040; --heaven:#e0e0e8;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--text); font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; line-height:1.6}
  header{padding:24px 20px 12px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#1a1a26,#12121a)}
  header h1{font-size:1.5rem; letter-spacing:.05em}
  header h1 span{color:var(--accent)}
  header p{color:var(--sub); font-size:.85rem; margin-top:4px}
  .controls{display:flex; flex-wrap:wrap; gap:10px; padding:16px 20px; align-items:center}
  .controls input,.controls select{background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:.9rem}
  .controls input{flex:1; min-width:180px}
  .count{color:var(--sub); font-size:.85rem; margin-left:auto}
  #grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; padding:0 20px 60px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; transition:transform .12s, border-color .12s}
  .card:hover{transform:translateY(-3px); border-color:var(--accent)}
  .thumb{aspect-ratio:1; background:var(--panel2); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden}
  .thumb img{width:100%; height:100%; object-fit:cover}
  .thumb .ph{font-size:3rem; font-weight:700; opacity:.35}
  .thumb .no{position:absolute; top:6px; left:8px; font-size:.7rem; color:var(--sub); background:rgba(0,0,0,.5); padding:1px 7px; border-radius:8px}
  .card .info{padding:10px 12px 12px}
  .card .name{font-weight:700}
  .badges{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px}
  .badge{font-size:.68rem; padding:1px 8px; border-radius:10px; border:1px solid var(--line); color:var(--sub)}
  .badge.clan{color:#111; font-weight:700; border:none}
  /* modal */
  #overlay{position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 16px; z-index:10}
  #overlay.open{display:flex}
  #modal{background:var(--panel); border:1px solid var(--line); border-radius:14px; max-width:820px; width:100%; padding:24px}
  #modal h2{font-size:1.4rem}
  #modal h2 small{color:var(--sub); font-size:.8rem; margin-left:8px}
  .close{float:right; background:none; border:none; color:var(--sub); font-size:1.4rem; cursor:pointer}
  .meta{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin:14px 0; font-size:.85rem}
  .meta div{background:var(--panel2); border-radius:8px; padding:8px 10px}
  .meta b{display:block; color:var(--sub); font-size:.7rem; font-weight:400}
  .setting{background:var(--panel2); border-left:3px solid var(--accent); padding:10px 14px; border-radius:0 8px 8px 0; font-size:.9rem; margin-bottom:14px}
  section h3{font-size:1rem; margin:18px 0 8px; color:var(--accent)}
  .rel{display:flex; flex-wrap:wrap; gap:8px}
  .rel button{background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 12px; cursor:pointer; text-align:left; font-size:.82rem; max-width:100%}
  .rel button:hover{border-color:var(--accent)}
  .rel .t{color:var(--accent); font-weight:700}
  .rel .n{color:var(--sub); display:block}
  .tabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px}
  .tabs button{background:var(--panel2); border:1px solid var(--line); color:var(--sub); border-radius:8px; padding:5px 12px; cursor:pointer; font-size:.8rem}
  .tabs button.on{color:var(--text); border-color:var(--accent)}
  .prompt{background:#0d0d14; border:1px solid var(--line); border-radius:8px; padding:12px; font-size:.8rem; position:relative; margin-bottom:8px; white-space:pre-wrap}
  .prompt .lang{color:var(--sub); font-size:.68rem; display:block; margin-bottom:4px}
  .copy{position:absolute; top:8px; right:8px; background:var(--panel2); border:1px solid var(--line); color:var(--sub); border-radius:6px; padding:3px 10px; font-size:.72rem; cursor:pointer}
  .copy:hover{color:var(--text)}
  .gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px}
  .gallery img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; border:1px solid var(--line)}
  .imgnote{color:var(--sub); font-size:.75rem; margin-top:6px}
  code{background:var(--panel2); padding:1px 6px; border-radius:4px; font-size:.78rem}
</style>
</head>
<body>
<header>
  <h1>Crypto<span>Ninja</span> 図鑑 <small style="font-size:.6em;color:var(--sub)">同人お助けサイト</small></h1>
  <p>キャラクター設定・相関・作画プロンプト集（出典: ninja-dao.com/characters）。二次創作は <a href="https://www.crypto-ninja.jp/" style="color:var(--accent)">CryptoNinja のガイドライン</a> に従ってください。</p>
  <nav style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
    <a href="motion.html" style="color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 14px;font-size:.82rem;text-decoration:none">🎬 SVGモーションシステム</a>
    <a href="embed.html" style="color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 14px;font-size:.82rem;text-decoration:none">🧩 ゲーム組み込みガイド</a>
    <a href="studio.html" style="color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 14px;font-size:.82rem;text-decoration:none">📖 同人スタジオ</a>
    <a href="reader.html" style="color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 14px;font-size:.82rem;text-decoration:none">📚 シートリーダー</a>
    <a href="members.html" style="color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 14px;font-size:.82rem;text-decoration:none">🔑 購入者専用</a>
  </nav>
</header>

<div class="controls">
  <input id="q" type="search" placeholder="名前・設定で検索…">
  <select id="fClan"><option value="">クラン: すべて</option></select>
  <select id="fNinjutsu"><option value="">忍術: すべて</option></select>
  <select id="fGenre"><option value="">得意ジャンル: すべて</option></select>
  <span class="count" id="count"></span>
</div>

<div id="grid"></div>

<div id="overlay"><div id="modal"></div></div>

<script>
const CLAN_COLOR = {Iga:'var(--iga)', Koka:'var(--koka)', Fuma:'var(--fuma)', Saika:'var(--saika)', 'Heavenly Realm':'var(--heaven)'};
const CLAN_JP = {Iga:'伊賀', Koka:'甲賀', Fuma:'風魔', Saika:'雑賀', 'Heavenly Realm':'天界'};
const VARIANTS = {chibi:'ちび（2頭身）', normal:'通常頭身', modern:'現代パロ', scifi:'SF', fantasy:'ファンタジー', isekai:'異世界'};
let DATA=null, byName={};

const slug = n => n.toLowerCase().split('(')[0].trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const dir = c => `images/characters/${c.no}_${slug(c.name)}`;

fetch('data/characters.json').then(r=>r.json()).then(d=>{
  DATA=d;
  d.characters.forEach(c=>byName[c.name]=c);
  fillSelect('fClan',[...new Set(d.characters.map(c=>c.clan))], v=>`${v}（${CLAN_JP[v]||v}）`);
  fillSelect('fNinjutsu',[...new Set(d.characters.map(c=>c.ninjutsu))].sort());
  fillSelect('fGenre', d.genre_list);
  render();
});

function fillSelect(id, vals, label){
  const s=document.getElementById(id);
  vals.forEach(v=>{const o=document.createElement('option'); o.value=v; o.textContent=label?label(v):v; s.appendChild(o);});
  s.onchange=render;
}
document.getElementById('q').oninput=render;

function filtered(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const clan=document.getElementById('fClan').value;
  const nin=document.getElementById('fNinjutsu').value;
  const gen=document.getElementById('fGenre').value;
  return DATA.characters.filter(c=>
    (!clan||c.clan===clan)&&(!nin||c.ninjutsu===nin)&&(!gen||c.genre===gen)&&
    (!q||(c.name+' '+c.setting+' '+c.no).toLowerCase().includes(q)));
}

function render(){
  const list=filtered();
  document.getElementById('count').textContent=`${list.length} / ${DATA.characters.length} 体`;
  document.getElementById('grid').innerHTML=list.map(c=>`
    <div class="card" onclick="openModal('${c.no}')">
      <div class="thumb">
        <span class="ph">${c.name[0]}</span>
        <img src="${dir(c)}/main.png" alt="" loading="lazy"
             onload="this.previousElementSibling.style.display='none'"
             onerror="if(!this.dataset.f){this.dataset.f=1;this.src='images/refs/${c.no}_${slug(c.name)}.png'}else{this.remove()}">
        <span class="no">#${c.no}</span>
      </div>
      <div class="info">
        <div class="name">${c.name}</div>
        <div class="badges">
          <span class="badge clan" style="background:${CLAN_COLOR[c.clan]||'var(--sub)'}">${CLAN_JP[c.clan]||c.clan}</span>
          <span class="badge">${c.ninjutsu}</span>
          <span class="badge">${c.genre.replace(/^\d+\.\s*/,'')}</span>
        </div>
      </div>
    </div>`).join('');
}

function openModal(no){
  const c=DATA.characters.find(x=>x.no===no); if(!c) return;
  const m=document.getElementById('modal');
  m.innerHTML=`
    <button class="close" onclick="closeModal()">✕</button>
    <h2>${c.name}<small>#${c.no} ／ ${CLAN_JP[c.clan]||c.clan}</small>
      <a href="sheet.html?no=${c.no}" style="font-size:.6em;color:var(--accent);margin-left:12px;text-decoration:none">📄 単体シートを開く</a></h2>
    <div class="meta">
      <div><b>忍術</b>${c.ninjutsu}</div>
      <div><b>武器</b>${c.weapon}</div>
      <div><b>誕生日</b>${c.birthday}</div>
      <div><b>得意ジャンル</b>${c.genre}</div>
    </div>
    <div class="setting">${c.setting}</div>
    <section><h3>画像置き場</h3>
      <div class="gallery" id="gal"></div>
      <p class="imgnote">📁 <code>${dir(c)}/</code> に <code>main.png</code>（サムネイル）や <code>01.png</code>〜<code>12.png</code> を置くとここに表示されます。</p>
    </section>
    ${c.relationships&&c.relationships.length?`<section><h3>相関</h3><div class="rel">${
      c.relationships.map(r=>{
        const t=byName[r.name];
        return `<button ${t?`onclick="openModal('${t.no}')"`:'disabled'}>
          <span class="t">${r.type}</span> ${r.name}<span class="n">${r.note||''}</span></button>`;
      }).join('')}</div></section>`:''}
    <section><h3>作画プロンプト</h3>
      <div class="tabs" id="tabs">${Object.keys(c.prompts).map((k,i)=>
        `<button class="${i?'':'on'}" onclick="showPrompt('${no}','${k}',this)">${VARIANTS[k]||k}</button>`).join('')}</div>
      <div id="pbox"></div>
    </section>`;
  document.getElementById('overlay').classList.add('open');
  showPrompt(no, Object.keys(c.prompts)[0], null);
  loadGallery(c);
}

function loadGallery(c){
  const gal=document.getElementById('gal');
  const names=['main.png',...Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')+'.png')];
  names.forEach(n=>{
    const img=new Image();
    img.src=`${dir(c)}/${n}`; img.loading='lazy'; img.alt=`${c.name} ${n}`;
    img.onload=()=>gal.appendChild(img);
  });
}

function showPrompt(no,key,btn){
  const c=DATA.characters.find(x=>x.no===no);
  if(btn){document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('on')); btn.classList.add('on');}
  const p=c.prompts[key];
  document.getElementById('pbox').innerHTML=['en','jp'].filter(l=>p[l]).map(l=>`
    <div class="prompt"><span class="lang">${l==='en'?'English':'日本語'}</span>${p[l]}
      <button class="copy" onclick="copyText(this)">コピー</button></div>`).join('');
}

function copyText(btn){
  const text=btn.parentElement.childNodes[1].textContent;
  navigator.clipboard.writeText(text.trim()).then(()=>{btn.textContent='✓ コピー済'; setTimeout(()=>btn.textContent='コピー',1500);});
}

function closeModal(){document.getElementById('overlay').classList.remove('open');}
document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
</script>
</body>
</html>
