<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キャラシート — CryptoNinja 図鑑</title>
<style>
  :root{
    --bg:#12121a; --panel:#1c1c28; --panel2:#242436; --line:#33334a;
    --text:#e8e8f0; --sub:#9a9ab0; --accent:#e0483e;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--text); font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; line-height:1.6}
  .wrap{max-width:820px; margin:0 auto; padding:20px 16px 60px}
  .topnav{display:flex; align-items:center; gap:10px; margin-bottom:14px; font-size:.85rem}
  .topnav a,.topnav button{color:var(--sub); text-decoration:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px 12px; cursor:pointer; font-size:.85rem}
  .topnav a:hover,.topnav button:hover{color:var(--text); border-color:var(--accent)}
  .topnav .spacer{margin-left:auto}
  .head{display:flex; gap:18px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px}
  .face{width:120px; height:120px; border-radius:14px; background:var(--panel2); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:3rem; font-weight:700; color:var(--sub); overflow:hidden}
  .face img{width:100%; height:100%; object-fit:cover}
  h1{font-size:1.6rem}
  h1 small{color:var(--sub); font-size:.55em; margin-left:10px; font-weight:400}
  .badges{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}
  .badge{font-size:.72rem; padding:2px 10px; border-radius:10px; border:1px solid var(--line); color:var(--sub)}
  .badge.clan{color:#111; font-weight:700; border:none}
  .meta{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin:14px 0; font-size:.86rem}
  .meta div{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px}
  .meta b{display:block; color:var(--sub); font-size:.7rem; font-weight:400}
  .setting{background:var(--panel); border-left:3px solid var(--accent); padding:10px 14px; border-radius:0 8px 8px 0; font-size:.92rem}
  section h2{font-size:1rem; margin:22px 0 8px; color:var(--accent)}
  .rel{display:flex; flex-wrap:wrap; gap:8px}
  .rel a{background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 12px; text-decoration:none; font-size:.82rem}
  .rel a:hover{border-color:var(--accent)}
  .rel .t{color:var(--accent); font-weight:700}
  .rel .n{color:var(--sub); display:block}
  .tabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px}
  .tabs button{background:var(--panel2); border:1px solid var(--line); color:var(--sub); border-radius:8px; padding:5px 12px; cursor:pointer; font-size:.8rem}
  .tabs button.on{color:var(--text); border-color:var(--accent)}
  .prompt{background:#0d0d14; border:1px solid var(--line); border-radius:8px; padding:12px; font-size:.8rem; position:relative; margin-bottom:8px; white-space:pre-wrap}
  .prompt .lang{color:var(--sub); font-size:.68rem; display:block; margin-bottom:4px}
  .copy{position:absolute; top:8px; right:8px; background:var(--panel2); border:1px solid var(--line); color:var(--sub); border-radius:6px; padding:3px 10px; font-size:.72rem; cursor:pointer}
  .gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px}
  .gallery img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; border:1px solid var(--line)}
  .imgnote{color:var(--sub); font-size:.75rem; margin-top:6px}
  code{background:var(--panel2); padding:1px 6px; border-radius:4px; font-size:.78rem}
  .err{padding:40px; text-align:center; color:var(--sub)}
  /* モデルシート分割 */
  .opnote{color:var(--sub); font-size:.78rem; margin:4px 0 8px}
  .panels{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; margin-bottom:12px}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; font-size:.78rem}
  .panel .pid{color:var(--accent); font-weight:700; font-family:monospace}
  .panel .pos{color:var(--sub); display:block; font-size:.7rem}
  .panel img{width:100%; aspect-ratio:1; object-fit:contain; background:var(--panel2); border-radius:6px; margin:6px 0; display:none}
  .panel .pbtns{display:flex; gap:4px; margin-top:6px}
  .panel .pbtns button{flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--sub); border-radius:6px; padding:3px 4px; font-size:.68rem; cursor:pointer}
  .panel .pbtns button:hover{color:var(--text); border-color:var(--accent)}
  .psec{margin:14px 0 6px; font-size:.88rem; font-weight:700}
  .rowimg{width:100%; border:1px solid var(--line); border-radius:10px; margin:4px 0 10px; display:none}
  .exgrid{display:grid; gap:4px; overflow-x:auto; margin-bottom:12px}
  .exgrid .cell{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 2px; font-size:.66rem; text-align:center; cursor:pointer; color:var(--sub); min-width:56px}
  .exgrid .cell:hover{color:var(--text); border-color:var(--accent)}
  .exgrid .hd{background:none; border:none; color:var(--sub); font-size:.68rem; cursor:default}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">読み込み中…</div></div>

<script type="module">
import { loadCharacters, getCharacter, imageDir, slug, CLAN_JP, CLAN_COLOR, VARIANTS } from './js/cn-data.js';

const params = new URLSearchParams(location.search);
const key = params.get('no') || params.get('name') || '001';
const app = document.getElementById('app');
const data = await loadCharacters();
const c = await getCharacter(key);

if (!c) {
  app.innerHTML = `<div class="err">キャラが見つかりません: ${key}<br><a href="index.html" style="color:var(--accent)">図鑑へ戻る</a></div>`;
} else {
  document.title = `${c.name} — キャラシート`;
  const i = data.characters.indexOf(c);
  const prev = data.characters[(i + data.characters.length - 1) % data.characters.length];
  const next = data.characters[(i + 1) % data.characters.length];
  const dir = imageDir(c);

  app.innerHTML = `
    <nav class="topnav">
      <a href="index.html">← 図鑑</a>
      <a href="sheet.html?no=${prev.no}">◀ ${prev.name}</a>
      <a href="sheet.html?no=${next.no}">${next.name} ▶</a>
      <span class="spacer"></span>
      <button id="dl">JSONダウンロード</button>
    </nav>
    <div class="head">
      <div class="face" id="face"><span>${c.name[0]}</span></div>
      <div>
        <h1>${c.name}<small>#${c.no}</small></h1>
        <div class="badges">
          <span class="badge clan" style="background:${CLAN_COLOR[c.clan] || '#888'}">${CLAN_JP[c.clan] || c.clan}</span>
          <span class="badge">忍術: ${c.ninjutsu}</span>
          <span class="badge">武器: ${c.weapon}</span>
        </div>
      </div>
    </div>
    <div class="meta">
      <div><b>誕生日</b>${c.birthday}</div>
      <div><b>得意ジャンル</b>${c.genre}</div>
      <div><b>クラン</b>${c.clan}（${CLAN_JP[c.clan] || '-'}）</div>
    </div>
    <div class="setting">${c.setting}</div>
    <section><h2>画像</h2>
      <div class="gallery" id="gal"></div>
      <p class="imgnote">📁 <code>images/characters/${c.no}_…/</code> に <code>main.png</code> / <code>01.png</code>〜<code>12.png</code> を置くと表示されます。</p>
    </section>
    <div id="modelsheet"></div>
    <div id="animesheet"></div>
    ${c.relationships?.length ? `<section><h2>相関</h2><div class="rel">${
      c.relationships.map(r => {
        const t = data.characters.find(x => x.name === r.name);
        return `<a href="${t ? `sheet.html?no=${t.no}` : '#'}">
          <span class="t">${r.type}</span> ${r.name}<span class="n">${r.note || ''}</span></a>`;
      }).join('')}</div></section>` : ''}
    <section><h2>作画プロンプト</h2>
      <div class="tabs" id="tabs">${Object.keys(c.prompts).map((k, j) =>
        `<button data-k="${k}" class="${j ? '' : 'on'}">${VARIANTS[k] || k}</button>`).join('')}</div>
      <div id="pbox"></div>
    </section>`;

  // サムネイル（main.png → 公式ref の順で表示）・ギャラリー
  const face = document.getElementById('face');
  const faceCandidates = [dir + 'main.png', `images/refs/${c.no}_${slug(c.name)}.png`];
  (function tryFace(i) {
    if (i >= faceCandidates.length) return;
    const img = new Image();
    img.src = faceCandidates[i]; img.alt = c.name;
    img.onload = () => { face.textContent = ''; face.appendChild(img); };
    img.onerror = () => tryFace(i + 1);
  })(0);
  const gal = document.getElementById('gal');
  ['main.png', ...Array.from({length: 12}, (_, n) => String(n + 1).padStart(2, '0') + '.png')].forEach(f => {
    const img = new Image();
    img.src = dir + f; img.loading = 'lazy'; img.alt = `${c.name} ${f}`;
    img.onload = () => gal.appendChild(img);
  });

  // プロンプト表示・コピー
  const pbox = document.getElementById('pbox');
  function show(k) {
    const p = c.prompts[k];
    pbox.innerHTML = ['en', 'jp'].filter(l => p[l]).map(l => `
      <div class="prompt"><span class="lang">${l === 'en' ? 'English' : '日本語'}</span>${p[l]}<button class="copy">コピー</button></div>`).join('');
    pbox.querySelectorAll('.copy').forEach(b => b.onclick = () => {
      navigator.clipboard.writeText(b.parentElement.childNodes[1].textContent.trim())
        .then(() => { b.textContent = '✓ コピー済'; setTimeout(() => b.textContent = 'コピー', 1500); });
    });
  }
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); show(b.dataset.k);
  });
  show(Object.keys(c.prompts)[0]);

  // モデルシート分割（output_prompt / panel_index を持つキャラのみ）
  renderModelSheet(c, dir);

  // アニメ版シート（アニメrefまたは生成済みアニメシートがあるキャラのみ表示）
  renderAnimeSheet(c, dir);

  // 1キャラ分のJSONを書き出し（ゲーム取り込み用）
  document.getElementById('dl').onclick = () => {
    const blob = new Blob([JSON.stringify(c, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${c.no}_${c.name}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
}

// ===== モデルシート分割ビュー =====
function renderModelSheet(c, dir) {
  const box = document.getElementById('modelsheet');
  if (!box || (!c.output_prompt && !c.panel_index)) return;
  const pdir = dir + 'panels/';
  const relDir = `images/characters/${c.no}_${slug(c.name)}/panels/`;
  const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

  // 各パネルを「そのIDだけ描画」する単体生成プロンプトを組み立て
  const sheetPrompt = lang => (c.output_prompt && c.output_prompt[lang]) || '';
  function panelPrompt(id, name) {
    const en = sheetPrompt('en');
    const head = en
      ? `Render ONLY the "${id}" panel (${name}) as a single standalone image, using the character design and art-style rules below. Ignore the multi-row sheet layout; output just this one panel on a clean background.\n\n`
      : '';
    return head + en;
  }

  let html = '<section><h2>モデルシート分割（ゲーム素材用）</h2>';

  // 生成済みシート画像（fal.aiで生成された sheet.png があれば表示）
  html += `<img id="genSheet" src="${dir}sheet.png" alt="生成モデルシート" style="display:none;width:100%;border:1px solid var(--line);border-radius:10px;margin-bottom:12px">`;

  // シート全体プロンプト
  if (c.output_prompt) {
    const op = c.output_prompt;
    html += `<p class="opnote">🎨 生成先: <code>${esc(op.target || '-')}</code> ／ 比率: <code>${esc(op.aspect_ratio || '-')}</code><br>1枚のモデルシート（三面図＋世界観バリエ＋表情＋ドット絵）を作るプロンプトです。</p>`;
    html += '<div class="tabs" id="opTabs">' +
      ['en', 'jp'].filter(l => op[l]).map((l, j) => `<button data-l="${l}" class="${j ? '' : 'on'}">${l === 'en' ? 'English' : '日本語'}</button>`).join('') +
      '</div><div class="prompt" id="opBox" style="max-height:220px;overflow-y:auto"></div>';
  }

  // パネル一覧（panels 型と rows/cols 型の両対応）
  if (c.panel_index) {
    for (const key of Object.keys(c.panel_index)) {
      const sec = c.panel_index[key];
      html += `<div class="psec">${esc(key)}. ${esc(sec.section || '')}</div>`;
      html += `<img class="rowimg" data-src="${dir}rows/row${esc(key)}.png" alt="row${esc(key)}">`;
      if (sec.panels) {
        html += '<div class="panels">';
        for (const pid of Object.keys(sec.panels)) {
          const p = sec.panels[pid];
          html += `<div class="panel" data-pid="${esc(pid)}">
            <span class="pid">${esc(pid)}</span> ${esc(p.name || '')}
            <span class="pos">${esc(p.pos || '')}</span>
            <img data-src="${pdir}${encodeURIComponent(pid)}.png" alt="${esc(p.name)}">
            <div class="pbtns">
              <button class="pcopy" data-pid="${esc(pid)}" data-name="${esc(p.name || '')}">プロンプト</button>
            </div></div>`;
        }
        html += '</div>';
      }
      if (sec.rows && sec.cols) {
        // 表情グリッド: 行=世界観, 列=表情
        html += '<div class="exgrid" style="grid-template-columns:80px repeat(' + Object.keys(sec.cols).length + ',1fr)">';
        html += '<div class="hd"></div>' + Object.keys(sec.cols).map(cn => `<div class="hd">${esc(sec.cols[cn])}</div>`).join('');
        for (const rk of Object.keys(sec.rows)) {
          html += `<div class="hd">${esc(sec.rows[rk])}</div>`;
          for (const ck of Object.keys(sec.cols)) {
            const pid = `${key}-${rk.split('-')[1]}-${ck}`;
            html += `<div class="cell pcopy" data-pid="${esc(pid)}" data-name="${esc(sec.rows[rk])}/${esc(sec.cols[ck])}" title="${esc(pid)}">${esc(sec.cols[ck])}</div>`;
          }
        }
        html += '</div>';
      }
    }
    if (c.panel_index_note) html += `<p class="opnote">${esc(c.panel_index_note)}</p>`;
    html += `<p class="opnote">💡 分割画像は <code>${esc(relDir)}&lt;パネルID&gt;.png</code>（例 <code>1-1.png</code>）に置くと各枠に表示されます。</p>`;
  }
  html += '</section>';
  box.innerHTML = html;

  // シート全体プロンプトのタブ＆コピー
  if (c.output_prompt) {
    const op = c.output_prompt;
    const opBox = document.getElementById('opBox');
    const showOp = l => {
      opBox.innerHTML = `<span class="lang">${l === 'en' ? 'English' : '日本語'}</span>${esc(op[l])}<button class="copy">コピー</button>`;
      opBox.querySelector('.copy').onclick = e => {
        navigator.clipboard.writeText(op[l]).then(() => {
          e.target.textContent = '✓ コピー済'; setTimeout(() => e.target.textContent = 'コピー', 1500);
        });
      };
    };
    box.querySelectorAll('#opTabs button').forEach(b => b.onclick = () => {
      box.querySelectorAll('#opTabs button').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); showOp(b.dataset.l);
    });
    showOp(op.en ? 'en' : 'jp');
  }

  // 生成済みシート画像（存在すれば表示）
  const gs = document.getElementById('genSheet');
  if (gs) { const probe = new Image(); probe.onload = () => gs.style.display = 'block'; probe.src = gs.src; }

  // 分割画像・行画像の遅延読み込み（存在するものだけ表示）
  box.querySelectorAll('.panel img[data-src], .rowimg[data-src]').forEach(img => {
    const probe = new Image();
    probe.onload = () => { img.src = probe.src; img.style.display = 'block'; };
    probe.src = img.dataset.src;
  });

  // 各パネルの「そのIDだけ描画」プロンプトをコピー
  box.querySelectorAll('.pcopy').forEach(el => el.onclick = () => {
    const txt = panelPrompt(el.dataset.pid, el.dataset.name);
    if (!txt) return;
    navigator.clipboard.writeText(txt).then(() => {
      const old = el.textContent; el.textContent = '✓ コピー済';
      setTimeout(() => el.textContent = old, 1200);
    });
  });
}

// ===== アニメ版シート（アニメ3面図基準・非ちび）— アニメ版限定の表示 =====
function renderAnimeSheet(c, dir) {
  const box = document.getElementById('animesheet');
  if (!box) return;
  const id = `${c.no}_${slug(c.name)}`;
  const animeRef = `images/refs/anime/${id}.png`;
  const animeRefLegacy = `images/refs/${id}_anime.png`;
  const rows = [
    ['1', 'TURNAROUND（三面図）'],
    ['2', 'ACTION POSES（アクションポーズ）'],
    ['3', 'EXPRESSION SHEET（表情）'],
    ['4', 'GAME SPRITES（ゲームスプライト）'],
  ];
  box.innerHTML = `
    <section id="animeSec" style="display:none"><h2>アニメ版シート（アニメ3面図基準）</h2>
      <p class="opnote">🎞 アニメ頭身限定の設定資料。参照画像 <code>${animeRef}</code> を基に
        Actions の <code>variant=anime-sheet</code> で生成できます（生成物: <code>${dir}anime/sheet.png</code>、行単位は <code>anime-row1〜4</code>）。</p>
      <div class="psec">参照（アニメ3面図）</div>
      <img class="rowimg" data-src="${animeRef}" data-fallback="${animeRefLegacy}" alt="anime ref">
      <div class="psec">生成シート</div>
      <img class="rowimg" data-src="${dir}anime/sheet.png" alt="anime sheet">
      ${rows.map(([n, label]) => `
        <div class="psec">${n}. ${label}</div>
        <img class="rowimg" data-src="${dir}anime/rows/row${n}.png" alt="anime row${n}">`).join('')}
    </section>`;
  // 1枚でも実在すればセクションを表示（data-fallback があれば第2候補も試す）
  const sec = document.getElementById('animeSec');
  box.querySelectorAll('.rowimg[data-src]').forEach(img => {
    const show = src => { img.src = src; img.style.display = 'block'; sec.style.display = 'block'; };
    const probe = new Image();
    probe.onload = () => show(probe.src);
    probe.onerror = () => {
      if (!img.dataset.fallback) return;
      const p2 = new Image();
      p2.onload = () => show(p2.src);
      p2.src = img.dataset.fallback;
    };
    probe.src = img.dataset.src;
  });
}
</script>
</body>
</html>
